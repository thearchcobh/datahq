<div id="arch-menu-app">
  <div class="arch-menu-status">Loading menu…</div>
</div>

<style>
  #arch-menu-app{--paper:#fbfaf7;--ink:#22211e;--muted:#766f66;--line:#ded9d0;--accent:#6e263a;max-width:980px;margin:0 auto;padding:8px 18px 28px;color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
  #arch-menu-app *{box-sizing:border-box}
  #arch-menu-app .arch-menu-status{padding:30px 0;color:var(--muted)}
  #arch-menu-app .arch-tab-control{
    position:absolute !important;
    width:1px !important;
    height:1px !important;
    overflow:hidden !important;
    clip:rect(0 0 0 0) !important;
    white-space:nowrap !important;
    clip-path:inset(50%) !important;
  }

  #arch-menu-app .arch-tabs-wrap{
    position:sticky;
    top:0;
    z-index:5;
    background:rgba(251,250,247,.97);
    backdrop-filter:blur(8px);
    padding:8px 0 10px;
    border-bottom:1px solid var(--line);
  }
  #arch-menu-app .arch-tabs{
    display:flex;
    width:100%;
    min-width:0;
    gap:0;
    overflow-x:auto !important;
    overflow-y:hidden !important;
    scrollbar-width:none;
    padding:0 38px 0 0;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain;
    touch-action:pan-y;
  }
  #arch-menu-app .arch-tabs::-webkit-scrollbar{display:none}
  #arch-menu-app .arch-tab{
    position:relative;
    flex:0 0 auto;
    display:block;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:10px 15px;
    font-size:13px;
    line-height:1.2;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  #arch-menu-app .arch-tab:first-child{padding-left:0}
  #arch-menu-app .arch-tab:not(:last-child)::after{
    content:"";
    position:absolute;
    right:0;
    top:50%;
    width:1px;
    height:15px;
    background:var(--line);
    transform:translateY(-50%);
  }
  #arch-menu-app .arch-tab-control[value="snacks"]:checked ~ .arch-tabs-wrap label[for="arch-tab-snacks"],
  #arch-menu-app .arch-tab-control[value="plates"]:checked ~ .arch-tabs-wrap label[for="arch-tab-plates"],
  #arch-menu-app .arch-tab-control[value="aperitif"]:checked ~ .arch-tabs-wrap label[for="arch-tab-aperitif"],
  #arch-menu-app .arch-tab-control[value="wine-glass"]:checked ~ .arch-tabs-wrap label[for="arch-tab-wine-glass"],
  #arch-menu-app .arch-tab-control[value="wine-bottle"]:checked ~ .arch-tabs-wrap label[for="arch-tab-wine-bottle"],
  #arch-menu-app .arch-tab-control[value="beer"]:checked ~ .arch-tabs-wrap label[for="arch-tab-beer"],
  #arch-menu-app .arch-tab-control[value="digestif"]:checked ~ .arch-tabs-wrap label[for="arch-tab-digestif"],
  #arch-menu-app .arch-tab-control[value="soft"]:checked ~ .arch-tabs-wrap label[for="arch-tab-soft"]{
    color:var(--ink);
  }
  #arch-menu-app .arch-tab-control[value="snacks"]:checked ~ .arch-tabs-wrap label[for="arch-tab-snacks"]::before,
  #arch-menu-app .arch-tab-control[value="plates"]:checked ~ .arch-tabs-wrap label[for="arch-tab-plates"]::before,
  #arch-menu-app .arch-tab-control[value="aperitif"]:checked ~ .arch-tabs-wrap label[for="arch-tab-aperitif"]::before,
  #arch-menu-app .arch-tab-control[value="wine-glass"]:checked ~ .arch-tabs-wrap label[for="arch-tab-wine-glass"]::before,
  #arch-menu-app .arch-tab-control[value="wine-bottle"]:checked ~ .arch-tabs-wrap label[for="arch-tab-wine-bottle"]::before,
  #arch-menu-app .arch-tab-control[value="beer"]:checked ~ .arch-tabs-wrap label[for="arch-tab-beer"]::before,
  #arch-menu-app .arch-tab-control[value="digestif"]:checked ~ .arch-tabs-wrap label[for="arch-tab-digestif"]::before,
  #arch-menu-app .arch-tab-control[value="soft"]:checked ~ .arch-tabs-wrap label[for="arch-tab-soft"]::before{
    content:"";
    position:absolute;
    left:15px;
    right:15px;
    bottom:3px;
    height:1px;
    background:var(--ink);
  }
  #arch-menu-app .arch-tab-control[value="snacks"]:checked ~ .arch-tabs-wrap label[for="arch-tab-snacks"]::before{left:0}

  #arch-menu-app .arch-scroll-arrow{
    position:absolute;
    top:0;
    bottom:1px;
    z-index:8;
    width:40px;
    border:0;
    padding:0;
    color:var(--ink);
    font:400 24px/1 Georgia,'Times New Roman',serif;
    cursor:pointer;
    transition:opacity .18s ease,visibility .18s ease;
  }
  #arch-menu-app .arch-scroll-left{
    left:0;
    text-align:left;
    padding-left:2px;
    background:linear-gradient(to left,rgba(251,250,247,0),rgba(251,250,247,.98) 58%);
  }
  #arch-menu-app .arch-scroll-right{
    right:0;
    text-align:right;
    padding-right:2px;
    background:linear-gradient(to right,rgba(251,250,247,0),rgba(251,250,247,.98) 58%);
  }
  #arch-menu-app .arch-tabs-wrap.is-at-start .arch-scroll-left,
  #arch-menu-app .arch-tabs-wrap.is-at-end .arch-scroll-right{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }

  #arch-menu-app .arch-panel{display:none;padding-top:28px}
  #arch-menu-app .arch-tab-control[value="snacks"]:checked ~ .arch-panels [data-panel="snacks"],
  #arch-menu-app .arch-tab-control[value="plates"]:checked ~ .arch-panels [data-panel="plates"],
  #arch-menu-app .arch-tab-control[value="aperitif"]:checked ~ .arch-panels [data-panel="aperitif"],
  #arch-menu-app .arch-tab-control[value="wine-glass"]:checked ~ .arch-panels [data-panel="wine-glass"],
  #arch-menu-app .arch-tab-control[value="wine-bottle"]:checked ~ .arch-panels [data-panel="wine-bottle"],
  #arch-menu-app .arch-tab-control[value="beer"]:checked ~ .arch-panels [data-panel="beer"],
  #arch-menu-app .arch-tab-control[value="digestif"]:checked ~ .arch-panels [data-panel="digestif"],
  #arch-menu-app .arch-tab-control[value="soft"]:checked ~ .arch-panels [data-panel="soft"]{
    display:block;
  }
  #arch-menu-app .arch-section-head{margin:0 0 18px}
  #arch-menu-app .arch-eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700;color:var(--muted);margin:0 0 5px}
  #arch-menu-app h2{font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.05;font-weight:500;margin:0}
  #arch-menu-app .arch-wine-group{margin:27px 0 0}
  #arch-menu-app .arch-wine-group:first-child{margin-top:0}
  #arch-menu-app .arch-wine-group>h3{font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:500;margin:0;padding:0 0 8px;border-bottom:1px solid var(--ink)}
  #arch-menu-app .arch-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;padding:14px 0;border-bottom:1px solid var(--line)}
  #arch-menu-app .arch-item-copy h4{font-size:15px;line-height:1.35;margin:0;font-weight:650}
  #arch-menu-app .arch-item-copy p{font-size:13px;line-height:1.45;color:var(--muted);margin:5px 0 0}
  #arch-menu-app .arch-item-copy .arch-tasting{font-family:Georgia,'Times New Roman',serif;font-style:italic}
  #arch-menu-app .arch-price{display:flex;gap:10px;align-items:flex-start;white-space:nowrap;text-align:right;font-size:14px}
  #arch-menu-app .arch-price-piece{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
  #arch-menu-app .arch-var-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
  #arch-menu-app .arch-wine-price{align-items:center;gap:6px}
  #arch-menu-app .arch-slash{color:var(--muted)}
  #arch-menu-app .arch-badge{
    position:relative;
    display:inline-block;
    vertical-align:1px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:1px 4px;
    margin-left:4px;
    font-size:9px;
    letter-spacing:.04em;
    color:var(--muted);
    cursor:default !important;
  }
  #arch-menu-app .arch-badge::after{
    content:attr(data-tooltip);
    position:absolute;
    left:50%;
    bottom:calc(100% + 7px);
    transform:translateX(-50%);
    z-index:20;
    background:var(--ink);
    color:#fff;
    border-radius:4px;
    padding:5px 7px;
    font:500 11px/1.2 Arial,Helvetica,sans-serif;
    letter-spacing:0;
    white-space:nowrap;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .12s ease,visibility .12s ease;
  }
  #arch-menu-app .arch-badge:hover::after,
  #arch-menu-app .arch-badge:focus-visible::after{
    opacity:1;
    visibility:visible;
  }
  #arch-menu-app .arch-note{font-size:12px;line-height:1.45;color:var(--muted);margin:18px 0 0}

  @media(max-width:600px){
    #arch-menu-app{padding:6px 13px 22px}
    #arch-menu-app .arch-tabs-wrap{padding-top:6px}
    #arch-menu-app .arch-tab{padding:9px 13px;font-size:12.5px}
    #arch-menu-app .arch-tab:first-child{padding-left:0}
    #arch-menu-app .arch-tab.is-active::before{left:13px;right:13px}
    #arch-menu-app h2{font-size:29px}
    #arch-menu-app .arch-item{gap:12px;padding:13px 0}
    #arch-menu-app .arch-item-copy h4{font-size:14px}
    #arch-menu-app .arch-item-copy p{font-size:12.5px}
    #arch-menu-app .arch-price{font-size:13px}
    #arch-menu-app .arch-wine-group>h3{font-size:19px}
  }
</style>

<script>
(function(){
  var root=document.getElementById('arch-menu-app');
  if(!root) return;

  var endpoint='https://tqrgwcixxifzdzsphdxj.supabase.co/functions/v1/arch-menu';
  var wineStyles=['Sparkling','Rosé','Orange / Skin Contact','White','Red'];
  var certificationTitles={
    'O':'Organic',
    'HVE':'High Environmental Value',
    'Bio':'Biodynamic',
    'V':'Vegan'
  };

  function esc(value){
    return String(value==null?'':value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  }

  function money(amount){
    if(amount==null) return '';
    return new Intl.NumberFormat('en-IE',{
      style:'currency',
      currency:'EUR',
      minimumFractionDigits:amount%100===0?0:2,
      maximumFractionDigits:2
    }).format(amount/100);
  }

  function simpleItem(item){
    var vars=item.variations||[];
    var prices=vars.map(function(v){
      var label=vars.length>1?'<span class="arch-var-label">'+esc(v.name||'Regular')+'</span>':'';
      return '<span class="arch-price-piece">'+label+'<strong>'+esc(money(v.price_amount))+'</strong></span>';
    }).join('');
    var desc=(item.description||'').trim();
    var same=desc.toLowerCase()===(item.display_name||'').toLowerCase();
    return '<article class="arch-item">'+
      '<div class="arch-item-copy"><h4>'+esc(item.display_name||item.name)+'</h4>'+
      (desc&&!same?'<p>'+esc(desc)+'</p>':'')+'</div>'+
      '<div class="arch-price">'+prices+'</div>'+
      '</article>';
  }

  function wineItem(item,mode){
    var vars=item.variations||[];
    var glass=vars.find(function(v){return /glass/i.test(v.name||'');});
    var bottle=vars.find(function(v){return /bottle/i.test(v.name||'')&&!/glass/i.test(v.name||'');});
    if(!bottle&&vars.length===1&&!/glass/i.test(vars[0].name||'')) bottle=vars[0];

    var priceHtml='';
    if(mode==='glass'&&glass){
      priceHtml='<strong>'+esc(money(glass.price_amount))+'</strong>';
      if(bottle) priceHtml+='<span class="arch-slash">/</span><strong>'+esc(money(bottle.price_amount))+'</strong>';
    }else if(mode==='bottle'&&bottle){
      priceHtml='<strong>'+esc(money(bottle.price_amount))+'</strong>';
    }

    var meta=[item.grape,item.country?'('+item.country+')':''].filter(Boolean).join(' ');
    var badges=(item.certifications||[]).map(function(c){
      var full=certificationTitles[c]||c;
      return '<span class="arch-badge" data-tooltip="'+esc(full)+'" aria-label="'+esc(full)+'" tabindex="0">'+esc(c)+'</span>';
    }).join('');

    return '<article class="arch-item">'+
      '<div class="arch-item-copy"><h4>'+esc(item.display_name||item.name)+' '+badges+'</h4>'+
      (meta?'<p>'+esc(meta)+'</p>':'')+
      (item.tasting_notes?'<p class="arch-tasting">'+esc(item.tasting_notes)+'</p>':'')+
      '</div><div class="arch-price arch-wine-price">'+priceHtml+'</div></article>';
  }

  function winePanel(items,mode){
    var html='';
    wineStyles.forEach(function(style){
      var matches=(items||[]).filter(function(i){return i.style===style;});
      if(!matches.length) return;
      html+='<section class="arch-wine-group"><h3>'+esc(style)+'</h3>'+
        matches.map(function(i){return wineItem(i,mode);}).join('')+
        '</section>';
    });
    return html||'<p class="arch-note">Nothing currently listed in this section.</p>';
  }

  function panel(key,eyebrow,title,body,extra){
    return '<section class="arch-panel" data-panel="'+key+'">'+
      '<header class="arch-section-head"><p class="arch-eyebrow">'+esc(eyebrow)+'</p><h2>'+esc(title)+'</h2></header>'+
      body+(extra||'')+'</section>';
  }

  function render(data){
    var s=data.sections||{};
    var tabs=[
      ['snacks','Snacks & Small Bites'],
      ['plates','Sharing Plates'],
      ['aperitif','Aperitif'],
      ['wine-glass','Wine by the Glass'],
      ['wine-bottle','Wine by the Bottle'],
      ['beer','Beer & Cider'],
      ['digestif','Digestif'],
      ['soft','Best of the Rest']
    ];

    var controls=tabs.map(function(t,i){
      return '<input class="arch-tab-control" type="radio" name="arch-menu-section" id="arch-tab-'+t[0]+'" value="'+t[0]+'"'+(i===0?' checked':'')+'>';
    }).join('');

    var nav=controls+
      '<div class="arch-tabs-wrap is-at-start">'+
      '<button type="button" class="arch-scroll-arrow arch-scroll-left" aria-label="Scroll menu sections left">‹</button>'+
      '<div class="arch-tabs">'+tabs.map(function(t){
        return '<label class="arch-tab" for="arch-tab-'+t[0]+'" data-tab="'+t[0]+'">'+esc(t[1])+'</label>';
      }).join('')+'</div>'+
      '<button type="button" class="arch-scroll-arrow arch-scroll-right" aria-label="Scroll menu sections right">›</button>'+
      '</div>';

    var legend='<p class="arch-note">O = Organic · HVE = High Environmental Value · Bio = Biodynamic · V = Vegan</p>';

    var panels='';
    panels+=panel('snacks','Food · from 2pm','Snacks & Small Bites',(s.snacks||[]).map(simpleItem).join(''));
    panels+=panel('plates','Food · from 2pm','Sharing Plates',(s.plates||[]).map(simpleItem).join(''));
    panels+=panel('aperitif','Drinks','Aperitif',(s.aperitif||[]).map(simpleItem).join(''));
    panels+=panel('wine-glass','Wine','By the Glass',winePanel(s.wine_glass,'glass'),legend);
    panels+=panel('wine-bottle','Wine','By the Bottle',winePanel(s.wine_bottle,'bottle'),legend);
    panels+=panel('beer','Drinks','Beer & Cider',(s.beer||[]).map(simpleItem).join(''));
    panels+=panel('digestif','Drinks','Digestif',(s.digestif||[]).map(simpleItem).join(''));
    panels+=panel('soft','Drinks','Best of the Rest',(s.soft||[]).map(simpleItem).join(''),'<p class="arch-note">Full range of teas & coffees available.</p>');

    root.innerHTML=nav+'<div class="arch-panels">'+panels+'</div>';

    var tabsWrap=root.querySelector('.arch-tabs-wrap');
    var tabsScroller=root.querySelector('.arch-tabs');
    var scrollLeftButton=root.querySelector('.arch-scroll-left');
    var scrollRightButton=root.querySelector('.arch-scroll-right');
    var tabLabels=[].slice.call(root.querySelectorAll('.arch-tab'));
    var tabControls=[].slice.call(root.querySelectorAll('.arch-tab-control'));

    function updateScrollCue(){
      if(!tabsWrap||!tabsScroller) return;
      var maxScroll=Math.max(0,tabsScroller.scrollWidth-tabsScroller.clientWidth);
      var hasOverflow=maxScroll>4;
      tabsWrap.classList.toggle('is-at-start',!hasOverflow||tabsScroller.scrollLeft<=4);
      tabsWrap.classList.toggle('is-at-end',!hasOverflow||tabsScroller.scrollLeft>=maxScroll-4);
    }

    function revealSelectedTab(){
      var checked=root.querySelector('.arch-tab-control:checked');
      if(!checked) return;
      var label=root.querySelector('label[for="'+checked.id+'"]');
      if(label&&label.scrollIntoView){
        label.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
      }
      window.setTimeout(updateScrollCue,220);
    }

    tabControls.forEach(function(control){
      control.addEventListener('change',revealSelectedTab);
    });

    if(tabsScroller){
      tabsScroller.addEventListener('scroll',updateScrollCue,{passive:true});

      // Square's mobile embed can swallow native horizontal overflow gestures.
      // Handle touch dragging ourselves, but only after a clear horizontal move,
      // so a normal tap on a menu section still activates its label/radio control.
      var touchId=null;
      var touchStartX=0;
      var touchStartY=0;
      var touchStartScroll=0;
      var touchDragging=false;

      tabsScroller.addEventListener('pointerdown',function(e){
        if(e.pointerType!=='touch') return;
        touchId=e.pointerId;
        touchStartX=e.clientX;
        touchStartY=e.clientY;
        touchStartScroll=tabsScroller.scrollLeft;
        touchDragging=false;
      });

      tabsScroller.addEventListener('pointermove',function(e){
        if(e.pointerType!=='touch'||e.pointerId!==touchId) return;
        var dx=e.clientX-touchStartX;
        var dy=e.clientY-touchStartY;

        if(!touchDragging){
          if(Math.abs(dx)<7) return;
          if(Math.abs(dx)<=Math.abs(dy)) return;
          touchDragging=true;
          try{tabsScroller.setPointerCapture(e.pointerId);}catch(_){}
        }

        if(e.cancelable) e.preventDefault();
        tabsScroller.scrollLeft=touchStartScroll-dx;
        updateScrollCue();
      });

      function endTouch(e){
        if(e.pointerId!==touchId) return;
        if(touchDragging){
          try{tabsScroller.releasePointerCapture(e.pointerId);}catch(_){}
        }
        touchId=null;
        touchDragging=false;
      }

      tabsScroller.addEventListener('pointerup',endTouch);
      tabsScroller.addEventListener('pointercancel',endTouch);
    }
    if(scrollLeftButton){
      scrollLeftButton.addEventListener('click',function(){
        tabsScroller.scrollBy({left:-Math.max(180,tabsScroller.clientWidth*.65),behavior:'smooth'});
      });
    }
    if(scrollRightButton){
      scrollRightButton.addEventListener('click',function(){
        tabsScroller.scrollBy({left:Math.max(180,tabsScroller.clientWidth*.65),behavior:'smooth'});
      });
    }
    window.addEventListener('resize',updateScrollCue);

    revealSelectedTab();
    window.setTimeout(updateScrollCue,0);
    window.setTimeout(updateScrollCue,250);
  }

  fetch(endpoint,{method:'GET',mode:'cors'})
    .then(function(r){if(!r.ok) throw new Error('Menu request failed'); return r.json();})
    .then(render)
    .catch(function(){
      root.innerHTML='<p class="arch-menu-status">Menu temporarily unavailable. Please try again shortly.</p>';
    });
})();
</script>
