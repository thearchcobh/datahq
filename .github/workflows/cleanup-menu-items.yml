name: Clean up Square menu items

on:
  workflow_dispatch:

concurrency:
  group: square-menu-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: https://tqrgwcixxifzdzsphdxj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply and verify menu item cleanup
        run: python -m datahq.cleanup_menu_items
