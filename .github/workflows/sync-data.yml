name: Sync operational data

on:
  workflow_dispatch:
    inputs:
      source:
        description: Data source to sync
        required: true
        default: square
        type: choice
        options:
          - square
          - revolut
          - all
  push:
    branches:
      - main
  schedule:
    - cron: "30 8 * * *"
      timezone: "Europe/Dublin"
    - cron: "0,30 9-23 * * *"
      timezone: "Europe/Dublin"

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: https://tqrgwcixxifzdzsphdxj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      REVOLUT_CLIENT_ID: spJWSodLx2C09lD6xvxMwJbkgKqpb8d5x2kC4KYORGA
      REVOLUT_ISSUER: example.com
      REVOLUT_PRIVATE_KEY: ${{ secrets.REVOLUT_PRIVATE_KEY }}
      REVOLUT_REFRESH_TOKEN: ${{ secrets.REVOLUT_REFRESH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check today's trading window
        id: window
        if: github.event_name == 'schedule'
        run: python3 -m datahq.sync_window

      - name: Set up Python
        if: steps.window.outputs.run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.window.outputs.run != 'false'
        run: pip install -r requirements.txt

      - name: Run sync
        if: steps.window.outputs.run != 'false'
        run: python -m datahq.main "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source || 'square' }}"
