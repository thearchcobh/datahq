name: Sync cruise calls

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - src/datahq/cruises.py
      - src/datahq/main.py
      - requirements.txt
      - .github/workflows/sync-cruises.yml
  schedule:
    - cron: "32 */3 * * *"

concurrency:
  group: cruise-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONPATH: src
      SUPABASE_URL: https://tqrgwcixxifzdzsphdxj.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync cruise calls
        run: python -m datahq.main cruises
