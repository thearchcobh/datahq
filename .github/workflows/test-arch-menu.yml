name: Test embedded menu endpoint

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public menu
        run: |
          set -euo pipefail
          url="https://tqrgwcixxifzdzsphdxj.supabase.co/functions/v1/arch-menu"
          curl --fail --silent --show-error --location "$url" -o /tmp/menu.html
          grep -q '<title>The Arch Menu</title>' /tmp/menu.html
          grep -q 'Aperitif' /tmp/menu.html
          grep -q 'Wine by the Glass' /tmp/menu.html
          grep -q 'Snacks & Small Bites' /tmp/menu.html
          grep -q 'Strawberry Lime Spritz' /tmp/menu.html
          grep -q 'Moretti' /tmp/menu.html
          echo "VERIFIED: public menu endpoint returned expected live HTML"
          wc -c /tmp/menu.html
