name: Test embedded menu endpoint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-arch-menu.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public menu
        run: |
          set -euo pipefail
          url="https://tqrgwcixxifzdzsphdxj.supabase.co/functions/v1/arch-menu"
          curl --fail --silent --show-error --location -D /tmp/headers.txt "$url" -o /tmp/menu.html
          echo "=== HEADERS ==="
          cat /tmp/headers.txt
          echo "=== FIRST LINES ==="
          head -n 8 /tmp/menu.html
          grep -qi '^content-type: text/html' /tmp/headers.txt
          grep -q '<title>The Arch Menu</title>' /tmp/menu.html
          echo "VERIFIED: endpoint is returning HTML with an HTML content type"
